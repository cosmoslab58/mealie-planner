name: Deploy (Local Self-Hosted Runner)

on:
  push:
    branches:
      - main
  # Manual re-run. A push that never produces a run -- an Actions outage, a
  # missed webhook -- otherwise leaves main sitting undeployed with nothing to
  # say so: the commit is on main, both working trees look clean, and prod is
  # quietly stale. Without this the only recourse is hand-deploying on bodhi.
  # Safe from any ref: the job hard-resets the host checkout to origin/main
  # regardless of what this is dispatched from.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to production directory
        run: |
          cd /home/nathan/projects/mealie-planner
          git fetch origin main
          git reset --hard origin/main
          git submodule update --init --recursive
          docker compose up -d --build
