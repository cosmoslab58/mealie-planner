services:
  mealie-planner:
    image: ghcr.io/cosmoslab58/mealie-planner:latest
    build: .
    container_name: mealie-planner
    restart: always
    labels:
      # The deploy workflow owns this container (compose up on every push).
      # Watchtower must not also recreate it from new GHCR images — a
      # watchtower-recreated container loses its compose project label and
      # the next compose deploy fails with a container-name conflict.
      - com.centurylinklabs.watchtower.enable=false
    ports:
      - "9926:9926"
    volumes:
      - ./data:/app/data
      # Uncomment the bind mounts below only if you are doing active local development
      # and want to propagate code changes without rebuilds:
      # - ./mealie_planner:/app/mealie_planner:ro
      # - ./mealie-mcp-server:/app/mealie-mcp-server:ro
      # - ./scripts:/app/scripts:ro
    env_file:
      - .env

networks:
  default:
    name: mealie_default
    external: true
